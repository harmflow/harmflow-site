# Scans the tree for secrets with gitleaks on every pull request and every push to main, whatever it changes: a
# credential can land in any file, so this workflow has no paths filter, unlike Checks. Its test runs first, so a scan
# that passes on everything fails the job.
#
# Every action is pinned to a full commit SHA, with the release it corresponds to in a comment, and the job names its
# runner image rather than ubuntu-latest; checks.yml says why.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A newer push to a pull request cancels that pull request's run still going. A run on main, or a dispatch, is the
# record for its own commit, so it is keyed on the commit and never cancelled.
concurrency:
  group: secrets-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # to check out the site
    # The gitleaks release the install step checks and the cache step keys on, set here so both steps read the same
    # pin. Dependabot cannot see it: refresh the version and the checksum by hand, from the release's
    # gitleaks_<version>_checksums.txt.
    env:
      VERSION: 8.30.1
      SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # No credential persisted, so .git, which the scan of the tree reads too, holds none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The gitleaks archive is kept in the Actions cache, keyed on the pinned version and checksum, so a short outage
      # of the release host does not fail the scan. The folder holds the archive only, outside the checkout the scan
      # reads; the install step checks the checksum after a restore as after a download.
      - name: Restore the gitleaks archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gitleaks-archive
          key: gitleaks-${{ env.VERSION }}-linux-x64-${{ env.SHA256 }}
      # The gitleaks CLI, as harmflow/harmflow-app's secret scans install it: a release binary, checked against its
      # SHA-256 before it is unpacked. The CLI is MIT and needs no key; gitleaks/gitleaks-action needs a license key
      # for a repository an organization owns. On a cache miss, or a restored archive that fails the check, the
      # archive is downloaded and checked again. With no --retry-delay, curl doubles its wait after each failed try,
      # from one second, within --retry-max-time; --connect-timeout and --max-time keep one hung try from using it up.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive=gitleaks_${VERSION}_linux_x64.tar.gz
          cache=$RUNNER_TEMP/gitleaks-archive
          dir=$RUNNER_TEMP/gitleaks
          check() { echo "$SHA256  $cache/$archive" | sha256sum --check; }
          mkdir -p "$cache" "$dir"
          if [[ -f $cache/$archive ]] && check; then
            echo "gitleaks $VERSION restored from the cache"
          else
            rm -f "$cache/$archive"
            curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-max-time 300 \
              --connect-timeout 30 --max-time 120 --output "$cache/$archive" \
              "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/$archive"
            check
          fi
          tar -xzf "$cache/$archive" -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/gitleaks" version
      - name: The scan fails on a tree with a private key
        run: python3 .github/scripts/scan-secrets-test.py -v
      # gitleaks's default rules over the files as they are; --redact keeps a finding's value out of the log.
      # scan-secrets-test.py runs this same command.
      - name: Scan the tree
        if: ${{ !cancelled() }}
        run: gitleaks dir . --redact --no-banner
