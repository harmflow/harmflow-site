# The site's checks, on every pull request and every push to main that changes what they read: site/, one of their
# scripts, or this workflow. The site has no build step: the checks read the files as committed. Each job first proves
# its checks on trees of its own that break them, which its test builds, so a check that passes on everything fails its
# job; then it runs them on the checkout. README.md gives the same commands to run them locally. A change that touches
# none of these paths runs no job here: the secret scan (secrets.yml) and the references check (references.yml) read
# every change.
#
# Every action is pinned to a full commit SHA, with the release it corresponds to in a comment, so a moved tag cannot
# change what CI runs; a new action follows the same rule. Every job names its runner image, ubuntu-26.04, rather than
# ubuntu-latest, so a new image arrives as a change of its own: refresh it by hand, with Playwright's version.
#
# No check is required by the branch's ruleset. A required check whose workflow a paths filter skips stays expected
# forever and blocks the pull request, so a check made required leaves this workflow, or loses its filter.
name: Checks

# The same paths for a pull request and for a push.
on:
  pull_request:
    paths:
      - site/**
      - .github/scripts/check-site*.py
      - .github/scripts/check-consent*.py
      - .github/scripts/check-samples*.py
      - .github/scripts/check-schema-coverage*.py
      - .github/scripts/check-api-coverage*.py
      - .github/workflows/checks.yml
  push:
    branches: [main]
    paths:
      - site/**
      - .github/scripts/check-site*.py
      - .github/scripts/check-consent*.py
      - .github/scripts/check-samples*.py
      - .github/scripts/check-schema-coverage*.py
      - .github/scripts/check-api-coverage*.py
      - .github/workflows/checks.yml
  workflow_dispatch:

permissions: {}

# A newer push to a pull request cancels that pull request's run still going. A run on main, or a dispatch, is the
# record for its own commit, so it is keyed on the commit and never cancelled.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Parity, shared blocks, links, and media
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # to check out the site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The checks fail on trees that break them
        run: python3 .github/scripts/check-site-test.py -v
      # After a failing test too, so a run names everything it found.
      - name: Check the site
        if: ${{ !cancelled() }}
        # site/, the folder GitHub Pages serves, read as the site's root.
        run: python3 .github/scripts/check-site.py site

  consent:
    name: Consent and analytics in a browser
    runs-on: ubuntu-26.04
    # The test grows with the site: each broken copy is every page, read again in the browser.
    timeout-minutes: 30
    permissions:
      contents: read # to check out the site
    steps:
      # The whole history, so the next step can read what the change touches. The repository is small.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The consent check's test reads its two scripts, this workflow's Playwright, and site/, whose consent script,
      # stylesheet, and pages outside docs/ its broken copies change. A change to the pages under site/docs/ and to
      # sitemap.xml alone reaches none of them, so it skips the test, which takes minutes, and the check below still
      # reads every page. Any other change runs it: a pull request's is read from its merge commit against the base it
      # merges into, a push's against the commit before it. A dispatch, or a commit before it that cannot be read, runs
      # it as well.
      - name: Find whether the change reaches the consent check's test
        id: reach
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            *) base= ;;
          esac
          run_test=true
          if [ -n "$base" ] && git rev-parse --quiet --verify "$base^{commit}" > /dev/null; then
            changed=$(git diff --name-only "$base" HEAD)
            inputs=$(grep -E '^(site/|\.github/scripts/check-consent(-test)?\.py$|\.github/workflows/checks\.yml$)' \
              <<< "$changed" || true)
            outside_docs=$(grep -Ev '^site/(docs/|sitemap\.xml$)' <<< "$inputs" || true)
            if [ -n "$changed" ] && [ -z "$outside_docs" ]; then
              run_test=false
              echo "The consent check's test is skipped: this change touches no file it reads outside the pages" \
                "under site/docs/ and sitemap.xml. The check still reads every page." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "test=$run_test" >> "$GITHUB_OUTPUT"
      # Playwright for Python and its Chromium, in a virtual environment of the job's own, since the runner's Python is
      # managed by the system. Dependabot cannot see this pin: refresh the version by hand.
      - name: Install Playwright
        env:
          PLAYWRIGHT_VERSION: 1.64.1
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "playwright==$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/venv/bin/python" -m playwright install --with-deps chromium
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: The consent check fails on trees that break it
        if: ${{ steps.reach.outputs.test == 'true' }}
        run: python3 .github/scripts/check-consent-test.py -v
      # After a failing test too, so a run names everything it found.
      - name: Check the consent and the analytics
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-consent.py site

  samples:
    name: Task file samples
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # to check out the site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PyYAML and jsonschema, in a virtual environment of the job's own, since the runner's Python is managed by the
      # system. Dependabot cannot see these pins: refresh the versions by hand. jsonschema 4.25.1 is its last release
      # that runs on a Mac's Python 3.9, which the README's local commands use.
      - name: Install PyYAML and jsonschema
        env:
          PYYAML_VERSION: 6.0.3
          JSONSCHEMA_VERSION: 4.25.1
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "PyYAML==$PYYAML_VERSION" "jsonschema==$JSONSCHEMA_VERSION"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: The samples check fails on pages that break it
        run: python3 .github/scripts/check-samples-test.py -v
      # After a failing test too, so a run names everything it found. It fetches the task schema from harmflow-app at
      # the commit the reference's link pins, by its full SHA.
      - name: Check the task file samples
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-samples.py site

  schema-coverage:
    name: Task schema fields and harnesses in the reference
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # to check out the site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The schema coverage check fails on pages that break it
        run: python3 .github/scripts/check-schema-coverage-test.py -v
      # After a failing test too, so a run names everything it found. It fetches the task schema from harmflow-app at
      # the commit the task file page's link pins, by its full SHA.
      - name: Check that the reference names the task schema's fields and harnesses
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-schema-coverage.py site

  api-coverage:
    name: Local API operations in the reference
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # to check out the site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PyYAML, in a virtual environment of the job's own, since the runner's Python is managed by the system.
      # Dependabot cannot see this pin: refresh the version by hand.
      - name: Install PyYAML
        env:
          PYYAML_VERSION: 6.0.3
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "PyYAML==$PYYAML_VERSION"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: The API coverage check fails on pages that break it
        run: python3 .github/scripts/check-api-coverage-test.py -v
      # After a failing test too, so a run names everything it found. It fetches the API description from harmflow-app
      # at the commit the local API page's link pins, by its full SHA.
      - name: Check that the reference names every operation of the local API
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-api-coverage.py site
