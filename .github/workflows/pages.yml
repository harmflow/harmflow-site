# Publishes site/ to GitHub Pages. The site has no build step: a pull request that changes site/ packages the files as
# committed, so a broken package fails before merge, and a push to main that changes it deploys them. A change outside
# site/ leaves the published site as it is; a dispatch deploys main again on demand, after a failed deployment, say.
#
# The jobs name their runner image rather than ubuntu-latest; checks.yml says why, and why a check filtered by paths is
# not required by the branch's ruleset.
name: Pages

# The same paths for a pull request and for a push.
on:
  pull_request:
    paths:
      - site/**
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# A new push cancels the superseded run of a pull request; a deployment on main is never cancelled.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package the site
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # to check out the site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write # to deploy the packaged site to GitHub Pages
      id-token: write # to prove to GitHub Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
