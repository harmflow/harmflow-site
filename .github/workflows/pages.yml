# Publishes site/ to GitHub Pages. The site has no build step: a pull request packages the files as committed, so a
# broken package fails before merge, and a push to main deploys them.
name: Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A new push cancels the superseded run of a pull request; a deployment on main is never cancelled.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package the site
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy the packaged site to GitHub Pages
      id-token: write # to prove to GitHub Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
